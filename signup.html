<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Render0X - Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #030510;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            left: -200px;
            top: 10%;
            background: rgba(150, 30, 255, 0.15);
            filter: blur(100px);
            border-radius: 50%;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            right: -200px;
            bottom: 0;
            background: rgba(30, 100, 255, 0.15);
            filter: blur(100px);
            border-radius: 50%;
        }

        .signup-box {
            position: relative;
            z-index: 2;

            width: 400px;
            max-width: 90%;

            padding: 40px;

            background: rgba(8, 11, 26, 0.95);

            border: 1px solid rgba(150, 70, 255, 0.35);

            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(150, 40, 255, 0.15),
                0 0 70px rgba(40, 100, 255, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    white,
                    #a63dff,
                    #318cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888ca0;
            margin-bottom: 32px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #cfd0dc;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;

            border-radius: 10px;

            border: 1px solid rgba(130, 90, 255, 0.3);

            background: #050816;
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #a33cff;

            box-shadow:
                0 0 15px rgba(160, 50, 255, 0.2);
        }

        .signup-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #8b2cff,
                    #327dff
                );

            box-shadow:
                0 0 18px rgba(130, 50, 255, 0.25);

            transition: 0.25s;
        }

        .signup-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 28px rgba(130, 50, 255, 0.45);
        }

        .signup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .signin-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #85899d;

            text-decoration: none;

            font-size: 14px;
        }

        .signin-link:hover {
            color: #b14cff;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #85899d;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #b14cff;
        }
    </style>

</head>

<body>

    <div class="signup-box">

        <div class="logo">
            Render0X
        </div>

        <div class="subtitle">
            Create your Render0X account
        </div>

        <form id="signupForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                autocomplete="username"
                maxlength="20"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                id="signupButton"
                class="signup-button"
            >
                🚀 Create Account
            </button>

        </form>

        <div id="status" class="status"></div>

        <a href="/signin" class="signin-link">
            Already have an account? Sign In
        </a>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        const form = document.getElementById("signupForm");
        const button = document.getElementById("signupButton");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            status.textContent = "";

            const username =
                document.getElementById("username")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value;


            if (password !== confirmPassword) {

                status.textContent =
                    "❌ Passwords do not match.";

                return;
            }


            button.disabled = true;
            button.textContent = "Creating Account...";


            try {

                const response = await fetch(
                    "/api/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (response.ok && data.success) {

                    status.textContent =
                        "✅ Account created successfully!";

                    setTimeout(function() {

                        window.location.href =
                            "/signin";

                    }, 1000);

                    return;
                }


                status.textContent =
                    "❌ " +
                    (
                        data.message ||
                        "Unable to create account."
                    );


            } catch (error) {

                console.error(
                    "Signup error:",
                    error
                );

                status.textContent =
                    "❌ Could not connect to the server.";

            } finally {

                button.disabled = false;
                button.textContent =
                    "🚀 Create Account";

            }

        });

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Render0X - Sign Up</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background: #030510;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
}

.signup-box {

    width: 400px;
    max-width: 90%;

    padding: 40px;

    background: rgba(8, 11, 26, 0.95);

    border: 1px solid rgba(150, 70, 255, 0.35);

    border-radius: 20px;

    box-shadow:
        0 0 30px rgba(150, 40, 255, 0.15),
        0 0 70px rgba(40, 100, 255, 0.08);
}

.logo {

    text-align: center;

    font-size: 32px;

    font-weight: bold;

    margin-bottom: 8px;

    background:
        linear-gradient(
            90deg,
            white,
            #a63dff,
            #318cff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {

    text-align: center;

    color: #888ca0;

    margin-bottom: 30px;

    font-size: 14px;
}

label {

    display: block;

    color: #cfd0dc;

    font-size: 14px;

    margin-bottom: 8px;
}

input {

    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 1px solid rgba(130, 90, 255, 0.3);

    background: #050816;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {

    border-color: #a33cff;

    box-shadow:
        0 0 15px rgba(160, 50, 255, 0.2);
}

.signup-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #8b2cff,
            #327dff
        );
}

.signup-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}

.message {

    display: none;

    margin-bottom: 18px;

    padding: 11px;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;
}

.back {

    display: block;

    text-align: center;

    margin-top: 22px;

    color: #85899d;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {
    color: #b14cff;
}

</style>

</head>

<body>

<div class="signup-box">

    <div class="logo">
        Render0X
    </div>

    <div class="subtitle">
        Create your Render0X account
    </div>

    <div id="message" class="message"></div>

    <form id="signupForm">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Choose a username"
            maxlength="20"
            required
        >

        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Choose a password"
            minlength="6"
            required
        >

        <label>
            Confirm Password
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="Enter password again"
            required
        >

        <button
            id="signupButton"
            class="signup-button"
            type="submit"
        >
            Create Account
        </button>

    </form>

    <a href="/signin" class="back">
        Already have an account? Sign In
    </a>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>


<script>

const form =
    document.getElementById("signupForm");

const button =
    document.getElementById("signupButton");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.style.display = "none";

        const username =
            document.getElementById("username")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                false
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            const response =
                await fetch(
                    "/api/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (
                response.ok &&
                data.success
            ) {

                showMessage(
                    "Account created! Redirecting to Sign In...",
                    true
                );

                setTimeout(
                    function() {
                        window.location.href =
                            "/signin";
                    },
                    1200
                );

                return;
            }


            showMessage(
                data.message ||
                "Could not create account.",
                false
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Could not connect to the server.",
                false
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }
);


function showMessage(text, success) {

    message.textContent = text;

    message.style.display = "block";

    if (success) {

        message.style.color =
            "#63e6be";

        message.style.background =
            "rgba(30, 255, 150, 0.08)";

        message.style.border =
            "1px solid rgba(30, 255, 150, 0.25)";

    } else {

        message.style.color =
            "#ff7d9c";

        message.style.background =
            "rgba(255, 30, 90, 0.08)";

        message.style.border =
            "1px solid rgba(255, 30, 90, 0.25)";
    }
}

</script>

</body>
</html>

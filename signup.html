 
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Render0X - Create Account</title>

<style>

:root {
    --primary: #d52cff;
    --secondary: #318cff;

    --background: #030510;
    --surface: #080b1a;
    --text: #ffffff;
    --muted: #b8bac8;
    --border: rgba(140, 65, 255, 0.35);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: var(--background);
    color: var(--text);

    display: flex;
    flex-direction: column;

    overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
    height: 88px;

    padding: 0 4%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;

    background: rgba(3, 5, 16, 0.94);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(12px);
}

.logo {
    display: flex;
    align-items: center;

    gap: 12px;

    color: white;
    text-decoration: none;

    font-size: 29px;
    font-weight: 700;
}

.logo-icon {
    width: 47px;
    height: 42px;

    border: 3px solid var(--primary);
    border-right-color: var(--secondary);

    border-radius: 14px;

    position: relative;

    box-shadow:
        0 0 12px var(--primary),
        0 0 22px rgba(45, 120, 255, 0.25);
}

.logo-icon::before {
    content: "•••";

    color: var(--primary);

    font-size: 18px;

    letter-spacing: 3px;

    position: absolute;

    top: 5px;
    left: 9px;
}

.logo-icon::after {
    content: "";

    position: absolute;

    bottom: -8px;
    left: 7px;

    width: 12px;
    height: 12px;

    border-left: 3px solid var(--primary);

    transform: skew(-25deg);
}

.logo span {
    background:
        linear-gradient(
            90deg,
            white 40%,
            var(--primary) 70%,
            var(--secondary)
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ================= NAV ================= */

nav {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 34px;
}

nav a {
    color: #eeeeee;

    text-decoration: none;

    font-size: 16px;

    transition: color 0.3s ease;
}

nav a:hover {
    color: var(--primary);
}

/* ================= SIGN IN BUTTON ================= */

.signin-button {
    padding: 11px 21px;

    border-radius: 9px;

    color: white;

    text-decoration: none;

    border: 2px solid transparent;

    background:
        linear-gradient(
            var(--surface),
            var(--surface)
        ) padding-box,

        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        ) border-box;

    transition: 0.3s ease;
}

.signin-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 22px var(--primary);
}

/* ================= MAIN ================= */

main {
    flex: 1;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 60px 20px;

    position: relative;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 50%,
            color-mix(
                in srgb,
                var(--primary) 12%,
                transparent
            ),
            transparent 32%
        ),

        radial-gradient(
            circle at 80% 50%,
            color-mix(
                in srgb,
                var(--secondary) 12%,
                transparent
            ),
            transparent 32%
        );
}

/* ================= GLOW ================= */

.glow {
    position: absolute;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    border:
        1px solid
        color-mix(
            in srgb,
            var(--primary) 20%,
            transparent
        );

    box-shadow:
        0 0 70px
        color-mix(
            in srgb,
            var(--primary) 10%,
            transparent
        );

    pointer-events: none;
}

.glow.one {
    left: -170px;
    top: 15%;
}

.glow.two {
    right: -170px;
    bottom: 10%;

    border-color:
        color-mix(
            in srgb,
            var(--secondary) 20%,
            transparent
        );
}

/* ================= SIGNUP CARD ================= */

.signup-card {
    width: 100%;

    max-width: 430px;

    padding: 40px;

    position: relative;

    z-index: 2;

    background:
        rgba(8, 11, 26, 0.88);

    border:
        1px solid var(--border);

    border-radius: 20px;

    box-shadow:
        0 0 35px
        color-mix(
            in srgb,
            var(--primary) 8%,
            transparent
        ),

        0 20px 60px
        rgba(0, 0, 0, 0.35);

    backdrop-filter: blur(15px);
}

.signup-card:hover {
    border-color:
        color-mix(
            in srgb,
            var(--primary) 65%,
            transparent
        );
}

/* ================= ICON ================= */

.signup-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    font-size: 30px;

    background:
        linear-gradient(
            var(--surface),
            var(--surface)
        ) padding-box,

        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        ) border-box;

    border: 2px solid transparent;

    box-shadow:
        0 0 25px
        color-mix(
            in srgb,
            var(--primary) 20%,
            transparent
        );
}

/* ================= TITLE ================= */

.signup-card h1 {
    text-align: center;

    font-size: 32px;

    margin-bottom: 10px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            #7950ff,
            var(--secondary)
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    text-align: center;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 30px;
}

/* ================= FORM ================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 600;
}

.form-group input {
    width: 100%;

    padding: 14px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    outline: none;

    font-size: 14px;

    transition: 0.25s ease;
}

.form-group input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 15px
        color-mix(
            in srgb,
            var(--primary) 15%,
            transparent
        );
}

.form-group input::placeholder {
    color: #777b8d;
}

/* ================= BUTTON ================= */

.signup-submit {
    width: 100%;

    min-height: 48px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 0 18px
        color-mix(
            in srgb,
            var(--primary) 22%,
            transparent
        );

    transition: 0.25s ease;
}

.signup-submit:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 28px
        color-mix(
            in srgb,
            var(--primary) 40%,
            transparent
        );
}

/* ================= STATUS ================= */

#signupStatus {
    min-height: 22px;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;

    color: var(--muted);
}

/* ================= LOGIN LINK ================= */

.login-text {
    text-align: center;

    margin-top: 25px;

    color: var(--muted);

    font-size: 14px;
}

.login-text a {
    color: var(--primary);

    text-decoration: none;

    font-weight: 600;
}

.login-text a:hover {
    text-decoration: underline;
}

/* ================= FOOTER ================= */

footer {
    padding: 25px 5% 22px;

    background: #02040c;

    border-top: 1px solid var(--border);

    text-align: center;
}

footer p {
    color: #747789;

    font-size: 14px;

    line-height: 1.7;
}

footer span {
    color: var(--primary);
}

/* ================= MOBILE ================= */

@media (max-width: 850px) {

    header {
        height: auto;

        min-height: 80px;

        padding: 16px 20px;

        flex-wrap: wrap;
    }

    nav {
        order: 3;

        width: 100%;

        justify-content: center;

        flex-wrap: wrap;
    }
}

@media (max-width: 550px) {

    .logo {
        font-size: 23px;
    }

    .logo-icon {
        width: 40px;
        height: 37px;
    }

    .signin-button {
        padding: 9px 13px;

        font-size: 13px;
    }

    nav {
        gap: 16px;
    }

    nav a {
        font-size: 14px;
    }

    main {
        padding: 40px 15px;
    }

    .signup-card {
        padding: 28px 22px;
    }

    .signup-card h1 {
        font-size: 28px;
    }
}

</style>

</head>


<body>


<!-- =================================================
     HEADER
     ================================================= -->

<header>

    <a href="index.html" class="logo">

        <div class="logo-icon"></div>

        <span>Render0X</span>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="about.html">
            About
        </a>

        <a href="info.html">
            Info
        </a>

        <a href="how-to-use.html">
            How to Use
        </a>

    </nav>


    <a
        href="signin.html"
        class="signin-button">

        👤 Sign In

    </a>

</header>



<!-- =================================================
     MAIN
     ================================================= -->

<main>

    <div class="glow one"></div>

    <div class="glow two"></div>


    <div class="signup-card">


        <div class="signup-icon">

            👤

        </div>


        <h1>

            Create Account

        </h1>


        <p class="subtitle">

            Create your Render0X account
            and join the community.

        </p>



        <!-- SIGNUP FORM -->

        <form id="signupForm">


            <div class="form-group">

                <label for="name">

                    Name

                </label>


                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>



            <div class="form-group">

                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>



            <div class="form-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>



            <button
                type="submit"
                class="signup-submit">

                🚀 Create Account

            </button>


            <p id="signupStatus"></p>


        </form>



        <p class="login-text">

            Already have an account?

            <a href="signin.html">

                Sign In

            </a>

        </p>


    </div>

</main>



<!-- =================================================
     FOOTER
     ================================================= -->

<footer>

    <p>

        © 2026
        <span>Render0X</span>.

        All rights reserved.

        &nbsp; • &nbsp;

        Connect. Chat. Play. Together.

    </p>

</footer>



<!-- =================================================
     THEME
     ================================================= -->

<script src="theme.js"></script>



<!-- =================================================
     SIGNUP
     ================================================= -->

<script>

const signupForm =
    document.getElementById("signupForm");

const signupStatus =
    document.getElementById("signupStatus");


signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (!name || !email || !password) {

            signupStatus.textContent =
                "❌ Please fill in all fields.";

            return;

        }


        if (password.length < 6) {

            signupStatus.textContent =
                "❌ Password must contain at least 6 characters.";

            return;

        }


        if (password !== confirmPassword) {

            signupStatus.textContent =
                "❌ Passwords do not match.";

            return;

        }


        signupStatus.textContent =
            "Creating account...";


        try {

            const response =
                await fetch(
                    "https://render0x-contact.onrender.com/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                signupStatus.textContent =
                    "✅ Account created successfully!";


                setTimeout(
                    function() {

                        window.location.href =
                            "signin.html";

                    },
                    1200
                );


            } else {

                signupStatus.textContent =
                    "❌ " +
                    (
                        data.message ||
                        "Unable to create account."
                    );

            }

        }

        catch (error) {

            console.error(error);

            signupStatus.textContent =
                "❌ Unable to connect to the server.";

        }

    }
);

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Render0X - Sign In</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: #030510;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            left: -200px;
            top: 10%;

            background: rgba(150, 30, 255, 0.15);

            filter: blur(100px);

            border-radius: 50%;
        }

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            right: -200px;
            bottom: 0;

            background: rgba(30, 100, 255, 0.15);

            filter: blur(100px);

            border-radius: 50%;
        }

        .signin-box {

            position: relative;
            z-index: 2;

            width: 400px;
            max-width: 90%;

            padding: 40px;

            background: rgba(8, 11, 26, 0.95);

            border: 1px solid rgba(150, 70, 255, 0.35);

            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(150, 40, 255, 0.15),
                0 0 70px rgba(40, 100, 255, 0.08);
        }

        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    white,
                    #a63dff,
                    #318cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            text-align: center;

            color: #888ca0;

            margin-bottom: 32px;

            font-size: 14px;
        }

        label {

            display: block;

            color: #cfd0dc;

            font-size: 14px;

            margin-bottom: 8px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border-radius: 10px;

            border: 1px solid rgba(130, 90, 255, 0.3);

            background: #050816;

            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {

            border-color: #a33cff;

            box-shadow:
                0 0 15px rgba(160, 50, 255, 0.2);
        }

        .signin-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #8b2cff,
                    #327dff
                );

            box-shadow:
                0 0 18px rgba(130, 50, 255, 0.25);

            transition: 0.25s;
        }

        .signin-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 0 28px rgba(130, 50, 255, 0.45);
        }

        .signin-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .error {

            display: none;

            margin-bottom: 18px;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            color: #ff7d9c;

            background: rgba(255, 30, 90, 0.08);

            border: 1px solid rgba(255, 30, 90, 0.25);
        }

        /* ================= SIGN UP ================= */

        .signup-text {

            text-align: center;

            margin-top: 24px;

            color: #85899d;

            font-size: 14px;
        }

        .signup-link {

            color: #a84cff;

            text-decoration: none;

            font-weight: bold;

            margin-left: 5px;

            transition: 0.2s;
        }

        .signup-link:hover {

            color: #318cff;

        }

        /* ================= BACK ================= */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #85899d;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .back:hover {

            color: #b14cff;

        }

    </style>

</head>


<body>

    <div class="signin-box">

        <div class="logo">
            Render0X
        </div>

        <div class="subtitle">
            Sign in to continue to Render0X
        </div>


        <!-- ERROR MESSAGE -->

        <div id="error" class="error"></div>


        <!-- SIGN IN FORM -->

        <form id="signinForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                maxlength="20"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="signinButton"
                class="signin-button"
            >
                Sign In
            </button>

        </form>


        <!-- SIGN UP OPTION -->

        <div class="signup-text">

            Don't have an account?

            <a href="/signup" class="signup-link">
                Sign Up
            </a>

        </div>


        <!-- BACK HOME -->

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        const form = document.getElementById("signinForm");

        const button =
            document.getElementById("signinButton");

        const errorBox =
            document.getElementById("error");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            errorBox.style.display = "none";


            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            button.disabled = true;

            button.textContent = "Signing In...";


            try {

                const response = await fetch(
                    "/api/signin",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok && data.success) {

                    /*
                     * Successful login.
                     * Send user to the protected chat.
                     */

                    window.location.href = "/chat";

                    return;
                }


                /*
                 * Login failed.
                 */

                errorBox.textContent =
                    data.message ||
                    "Invalid username or password.";

                errorBox.style.display = "block";

            }


            catch (error) {

                console.error(
                    "Sign in error:",
                    error
                );

                errorBox.textContent =
                    "Could not connect to the server.";

                errorBox.style.display = "block";

            }


            finally {

                button.disabled = false;

                button.textContent = "Sign In";

            }

        });

    </script>

</body>

</html>

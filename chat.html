<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Render0X - Chat</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #030510;

            color: white;

            display: flex;
            flex-direction: column;
        }

        header {

            height: 80px;

            padding: 0 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(120, 90, 255, 0.2);

            background:
                rgba(3, 5, 16, 0.96);
        }

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            font-size: 27px;

            font-weight: bold;

            text-decoration: none;
        }

        .logo-icon {

            width: 40px;
            height: 36px;

            border:
                3px solid #a83cff;

            border-right-color:
                #318cff;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 0 12px
                rgba(190, 40, 255, 0.5);
        }

        .logo-icon::before {

            content: "•••";

            color: #a653ff;

            letter-spacing: 2px;
        }

        .user-area {

            display: flex;

            align-items: center;

            gap: 14px;
        }

        .signed-user {

            padding: 9px 15px;

            border-radius: 20px;

            color: #bfa0ff;

            background:
                rgba(150, 50, 255, 0.08);

            border:
                1px solid
                rgba(150, 50, 255, 0.3);

            font-size: 14px;
        }

        .logout {

            padding: 10px 18px;

            border-radius: 9px;

            color: white;

            border:
                1px solid
                rgba(230, 40, 255, 0.5);

            background:
                rgba(100, 30, 150, 0.1);

            cursor: pointer;

            transition: 0.2s;
        }

        .logout:hover {

            background:
                linear-gradient(
                    90deg,
                    #8c2cff,
                    #327dff
                );

            transform: translateY(-2px);
        }

        main {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .chat-box {

            width: 900px;

            max-width: 100%;

            height: 650px;

            max-height: 80vh;

            display: flex;

            flex-direction: column;

            background:
                rgba(7, 10, 25, 0.95);

            border:
                1px solid
                rgba(130, 80, 255, 0.25);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 0 40px
                rgba(120, 40, 255, 0.1);
        }

        .chat-header {

            padding: 18px 22px;

            border-bottom:
                1px solid
                rgba(120, 90, 255, 0.15);

            color: #cfcfe0;

            font-size: 16px;
        }

        #messages {

            flex: 1;

            padding: 22px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .message {

            max-width: 75%;

            padding: 12px 16px;

            border-radius: 13px;

            line-height: 1.5;

            font-size: 15px;
        }

        .bot {

            align-self: flex-start;

            background:
                rgba(110, 50, 220, 0.12);

            border:
                1px solid
                rgba(150, 80, 255, 0.2);
        }

        .user {

            align-self: flex-end;

            background:
                linear-gradient(
                    90deg,
                    rgba(120, 40, 220, 0.35),
                    rgba(40, 100, 230, 0.35)
                );
        }

        .input-area {

            display: flex;

            gap: 10px;

            padding: 16px;

            border-top:
                1px solid
                rgba(120, 90, 255, 0.15);
        }

        #messageInput {

            flex: 1;

            padding: 13px 15px;

            border-radius: 10px;

            border:
                1px solid
                rgba(120, 90, 255, 0.3);

            background: #050816;

            color: white;

            outline: none;

            font-size: 15px;
        }

        #messageInput:focus {

            border-color: #9c43ff;

            box-shadow:
                0 0 12px
                rgba(150, 50, 255, 0.15);
        }

        #sendButton {

            padding: 0 22px;

            border: none;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #8d2cff,
                    #327dff
                );

            cursor: pointer;
        }

        @media(max-width:700px) {

            header {

                height: auto;

                padding: 15px 20px;

                gap: 12px;

                flex-wrap: wrap;
            }

            .signed-user {

                font-size: 12px;
            }

            .chat-box {

                height: 75vh;
            }

            .message {

                max-width: 90%;
            }

        }

    </style>

</head>

<body>

    <header>

        <a href="/" class="logo">

            <div class="logo-icon"></div>

            Render0X

        </a>

        <div class="user-area">

            <div class="signed-user">
                ✓ Signed in as
                <strong id="username">
                    {{ username }}
                </strong>
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>

    </header>


    <main>

        <div class="chat-box">

            <div class="chat-header">
                💬 Render0X Chat
            </div>

            <div id="messages">

                <div class="message bot">
                    Welcome to Render0X!
                    You are successfully signed in.
                </div>

            </div>

            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </main>


    <script>

        const input =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const messages =
            document.getElementById("messages");


        function addMessage(text, type) {

            const message =
                document.createElement("div");

            message.className =
                "message " + type;

            message.textContent = text;

            messages.appendChild(message);

            messages.scrollTop =
                messages.scrollHeight;
        }


        async function sendMessage() {

            const text =
                input.value.trim();

            if (!text) {
                return;
            }

            addMessage(text, "user");

            input.value = "";

            try {

                const response =
                    await fetch("/api/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })

                    });

                const data =
                    await response.json();

                if (response.status === 401) {

                    window.location.href =
                        "/signin";

                    return;
                }

                if (data.success) {

                    addMessage(
                        data.reply,
                        "bot"
                    );

                } else {

                    addMessage(
                        data.message ||
                        "Something went wrong.",
                        "bot"
                    );
                }

            } catch (error) {

                console.error(error);

                addMessage(
                    "Could not connect to the server.",
                    "bot"
                );
            }
        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );


        async function logout() {

            try {

                const response =
                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );

                const data =
                    await response.json();

                if (data.success) {

                    window.location.href =
                        "/signin";

                } else {

                    alert(
                        "Logout failed."
                    );
                }

            } catch (error) {

                console.error(error);

                alert(
                    "Could not connect to the server."
                );
            }
        }

    </script>

</body>

</html>

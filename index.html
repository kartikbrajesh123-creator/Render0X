<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Render0X</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #030510;
            color: white;

            display: flex;
            flex-direction: column;
        }


        /* =================================================
           HEADER
           ================================================= */

        header {
            height: 90px;

            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(120, 90, 255, 0.2);

            background: rgba(3, 5, 16, 0.96);
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;

            gap: 12px;

            text-decoration: none;

            color: white;

            font-size: 29px;
            font-weight: bold;
        }


        .logo-icon {
            width: 46px;
            height: 40px;

            border: 3px solid #a83cff;
            border-right-color: #318cff;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 12px rgba(190, 40, 255, 0.7),
                0 0 18px rgba(40, 120, 255, 0.4);

            position: relative;
        }


        .logo-icon::before {
            content: "•••";

            color: #9d52ff;

            font-size: 18px;

            letter-spacing: 3px;
        }


        .logo-icon::after {
            content: "";

            position: absolute;

            bottom: -8px;
            left: 7px;

            width: 12px;
            height: 12px;

            border-left: 3px solid #a83cff;

            transform: skew(-25deg);
        }


        .logo span {
            background:
                linear-gradient(
                    90deg,
                    white 45%,
                    #a63dff 70%,
                    #318cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        /* NAVIGATION */

        nav {
            display: flex;

            align-items: center;

            gap: 35px;
        }


        nav a {
            color: #d5d5df;

            text-decoration: none;

            font-size: 16px;

            transition: 0.25s;
        }


        nav a:hover {
            color: #b14cff;
        }


        /* =================================================
           SIGN IN / USER BUTTON
           ================================================= */

        .signin-button {

            padding: 11px 22px;

            border-radius: 9px;

            text-decoration: none;

            color: white;

            border: 2px solid transparent;

            background:
                linear-gradient(#080b1a, #080b1a) padding-box,
                linear-gradient(
                    90deg,
                    #ed27ff,
                    #348cff
                ) border-box;

            box-shadow:
                0 0 13px rgba(180, 50, 255, 0.3);

            transition: 0.25s;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            white-space: nowrap;
        }


        .signin-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 0 22px rgba(180, 50, 255, 0.5);
        }


        /* =================================================
           MAIN
           ================================================= */

        main {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 25% 50%,
                    rgba(130, 0, 255, 0.13),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 75% 50%,
                    rgba(0, 100, 255, 0.13),
                    transparent 30%
                );
        }


        /* =================================================
           DECORATIVE GLOW
           ================================================= */

        .glow {

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            border:
                1px solid rgba(170, 50, 255, 0.18);

            box-shadow:

                0 0 60px
                rgba(150, 40, 255, 0.08),

                inset 0 0 60px
                rgba(50, 120, 255, 0.05);
        }


        .glow.one {

            left: -120px;

            top: 15%;
        }


        .glow.two {

            right: -120px;

            bottom: 10%;

            border-color:
                rgba(40, 130, 255, 0.18);
        }


        /* =================================================
           MAIN CARD
           ================================================= */

        .login-card {

            position: relative;

            z-index: 2;

            width: 600px;

            max-width: 90%;

            padding: 50px 40px;

            border-radius: 22px;

            background:
                rgba(8, 11, 26, 0.80);

            border:
                1px solid rgba(150, 70, 255, 0.22);

            box-shadow:

                0 0 40px
                rgba(150, 40, 255, 0.08),

                0 0 80px
                rgba(40, 100, 255, 0.05);

            backdrop-filter: blur(8px);
        }


        .login-icon {

            width: 90px;
            height: 90px;

            margin: 0 auto 28px;

            border-radius: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 43px;

            border: 2px solid transparent;

            background:

                linear-gradient(
                    #080b1a,
                    #080b1a
                ) padding-box,

                linear-gradient(
                    135deg,
                    #e32cff,
                    #348cff
                ) border-box;

            box-shadow:

                0 0 25px
                rgba(190, 40, 255, 0.3),

                0 0 35px
                rgba(40, 120, 255, 0.2);
        }


        /* =================================================
           TEXT
           ================================================= */

        .login-card h1 {

            font-size: 48px;

            margin-bottom: 16px;

            background:

                linear-gradient(
                    90deg,
                    #d03cff,
                    #7650ff,
                    #318cff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .subtitle {

            color: #999aaa;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 25px;
        }


        /* =================================================
           CHAT BUTTON
           ================================================= */

        .chat-button {

            display: inline-block;

            margin-top: 10px;

            padding: 14px 30px;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            border: 1px solid #7246ff;

            background:
                rgba(100, 50, 255, 0.08);

            transition: 0.25s;
        }


        .chat-button:hover {

            background:
                linear-gradient(
                    90deg,
                    #792cff,
                    #327dff
                );

            box-shadow:
                0 0 20px
                rgba(120, 50, 255, 0.4);

            transform:
                translateY(-2px);
        }


        /* =================================================
           STATUS
           ================================================= */

        #authStatus {

            margin-top: 22px;

            min-height: 20px;

            color: #85899d;

            font-size: 14px;
        }


        /* =================================================
           FOOTER
           ================================================= */

        footer {

            border-top:
                1px solid
                rgba(120, 90, 255, 0.18);

            padding: 22px 5%;

            text-align: center;

            background: #02040c;
        }


        footer p {

            color: #707487;

            font-size: 14px;
        }


        footer span {

            color: #a84cff;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 800px) {

            header {

                height: auto;

                padding: 18px 20px;

                flex-wrap: wrap;

                gap: 18px;
            }


            nav {

                order: 3;

                width: 100%;

                justify-content: center;

                gap: 20px;

                flex-wrap: wrap;
            }


            .logo {

                font-size: 24px;
            }


            .signin-button {

                font-size: 14px;

                padding: 9px 15px;
            }


            .login-card {

                padding:
                    40px 25px;
            }


            .login-card h1 {

                font-size: 38px;
            }


            .subtitle {

                font-size: 15px;
            }
        }


        @media (max-width: 550px) {

            header {

                gap: 12px;
            }


            .logo {

                font-size: 23px;
            }


            .logo-icon {

                width: 40px;

                height: 37px;
            }


            nav {

                gap: 16px;
            }


            nav a {

                font-size: 14px;
            }


            .login-card {

                padding:
                    30px 20px;
            }


            .login-card h1 {

                font-size: 30px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>


        <!-- LOGO -->

        <a href="/" class="logo">

            <div class="logo-icon"></div>

            <span>
                Render0X
            </span>

        </a>


        <!-- NAVIGATION -->

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/about">
                About
            </a>

            <a href="/info">
                Info
            </a>

            <a href="/how-to-use">
                How to Use
            </a>

        </nav>


        <!-- AUTH AREA -->

        <div id="authArea">

            <a
                href="/signin"
                class="signin-button"
            >
                👤 Sign In
            </a>

        </div>


    </header>



    <!-- =================================================
         MAIN
         ================================================= -->

    <main>


        <div class="glow one"></div>

        <div class="glow two"></div>


        <div class="login-card">


            <div class="login-icon">
                💬
            </div>


            <h1>
                Welcome to Render0X
            </h1>


            <p class="subtitle">

                Connect. Chat. Play. Together.

                <br>

                Sign in to access the Render0X chat.

            </p>


            <a
                href="/chat"
                class="chat-button"
            >
                💬 Open Chat
            </a>


            <p id="authStatus">
                Checking sign-in status...
            </p>


        </div>


    </main>



    <!-- =================================================
         FOOTER
         ================================================= -->

    <footer>

        <p>

            © 2026

            <span>
                Render0X
            </span>.

            All rights reserved.

            &nbsp; • &nbsp;

            Connect. Chat. Play. Together.

        </p>

    </footer>



    <!-- =================================================
         AUTHENTICATION
         ================================================= -->

    <script>

        const authArea =
            document.getElementById("authArea");

        const authStatus =
            document.getElementById("authStatus");


        /*
         * Check whether the Flask session
         * currently contains a signed-in user.
         */

        async function updateAuthUI() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            method: "GET",

                            credentials: "include"
                        }
                    );


                const data =
                    await response.json();


                if (data.signed_in) {


                    /*
                     * USER IS SIGNED IN
                     */

                    authArea.innerHTML = `

                        <div style="
                            display:flex;
                            align-items:center;
                            gap:12px;
                        ">

                            <span style="
                                color:#bfc1cf;
                                font-size:14px;
                            ">

                                👤 ${escapeHTML(data.username)}

                            </span>


                            <button
                                onclick="logoutUser()"
                                class="signin-button"
                                style="
                                    cursor:pointer;
                                "
                            >

                                🚪 Logout

                            </button>

                        </div>

                    `;


                    authStatus.innerHTML = `

                        <span style="
                            color:#63e6be;
                        ">

                            ✓ Signed in as
                            <strong>
                                ${escapeHTML(data.username)}
                            </strong>

                        </span>

                    `;


                } else {


                    /*
                     * USER IS NOT SIGNED IN
                     */

                    authArea.innerHTML = `

                        <a
                            href="/signin"
                            class="signin-button"
                        >

                            👤 Sign In

                        </a>

                    `;


                    authStatus.innerHTML = `

                        <span style="
                            color:#999aaa;
                        ">

                            🔒 Please sign in to use chat.

                        </span>

                    `;

                }


            } catch (error) {


                console.error(
                    "Authentication check failed:",
                    error
                );


                authArea.innerHTML = `

                    <a
                        href="/signin"
                        class="signin-button"
                    >

                        👤 Sign In

                    </a>

                `;


                authStatus.innerHTML = `

                    <span style="
                        color:#999aaa;
                    ">

                        🔒 Please sign in to use chat.

                    </span>

                `;

            }

        }



        /*
         * LOGOUT
         */

        async function logoutUser() {

            try {


                const response =
                    await fetch(
                        "/api/logout",
                        {
                            method: "POST",

                            credentials: "include"
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    /*
                     * Refresh the page.
                     * The Sign In button will
                     * appear again.
                     */

                    window.location.reload();

                } else {

                    alert(
                        "Logout failed. Please try again."
                    );

                }


            } catch (error) {


                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Could not connect to the server."
                );

            }

        }



        /*
         * Prevent a username from being inserted
         * as HTML.
         */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }



        /*
         * Run authentication check
         * when the page loads.
         */

        updateAuthUI();

    </script>


</body>

</html>
